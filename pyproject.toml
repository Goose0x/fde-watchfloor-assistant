[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-watchfloor-assistant"
version = "0.1.0"
description = "Need-to-know retrieval assistant with document-level RBAC, deterministic PII masking, and durable human approval gates."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
llm = [
  "anthropic>=0.39",
  "google-genai>=1.0",
]
postgres = [
  "psycopg[binary]>=3.2",
]
temporal = [
  "temporalio>=1.8",
]

[project.scripts]
watchfloor = "watchfloor.cli:main"

[project.urls]
Repository = "https://github.com/Goose0x/fde-watchfloor-assistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]
