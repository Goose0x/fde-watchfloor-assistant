{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "watchfloor.fullname" . }}-egress
  labels:
    app.kubernetes.io/name: watchfloor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: watchfloor
  policyTypes:
    - Egress
  egress:
    # Cluster DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.postgres.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.postgres.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgres.port }}
    {{- end }}
    {{- if .Values.networkPolicy.allowRestrictedGoogleAPIs }}
    # restricted.googleapis.com (Private Google Access / VPC Service Controls)
    - to:
        - ipBlock:
            cidr: 199.36.153.4/30
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
